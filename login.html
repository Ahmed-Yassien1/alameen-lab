<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المرضى</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh">
<div style="background:white;padding:24px;border-radius:16px;width:90%;max-width:400px;text-align:center">
<h2 style="color:#0E4DA4;font-weight:bold">استعلم عن نتيجتك</h2>
<input id="phone" placeholder="01xxxxxxxxx" style="width:100%;border:1px solid #ccc;padding:12px;border-radius:12px;margin-top:12px;text-align:center">
<button onclick="search()" style="width:100%;background:#0E4DA4;color:white;padding:12px;border-radius:12px;margin-top:12px">عرض النتائج</button>
<div id="result" style="margin-top:12px"></div>
<a href="index.html">العودة</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
async function search(){
 let p=document.getElementById(\'phone\').value;
 let r=await supabase.from(\'patients\').select(\'*\').eq(\'phone\',p).single();
 document.getElementById(\'result\').innerHTML = r.data ? \'مرحبا \'+r.data.name : \'<span style=color:red>لا يوجد مريض</span>\';
}
</script>
</body>
</html>
